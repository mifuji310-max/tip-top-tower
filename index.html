<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141932">
<title>Tip Top Tower</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=0.20.0">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=0.20.0">
<link rel="manifest" href="manifest.webmanifest?v=0.20.0">
<meta name="apple-mobile-web-app-title" content="Tip Top Tower">
<meta name="description" content="ブロックを積んで、空のてっぺんへ。スマホで遊べる3Dブロック積みミニゲーム">
<style>
:root{color-scheme:dark;--ink:#f8faff;--soft:#b8c4e7;--edge:#59678e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#12162b;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -15%,#354477 0%,#181e3f 44%,#11152b 100%)}
.wrap{max-width:460px;margin:auto;padding:14px 14px max(20px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.eyebrow{font-size:10px;letter-spacing:.22em;color:#a6cff9;font-weight:900;margin-bottom:3px}
h1{font-size:clamp(23px,6.4vw,31px);font-weight:1000;letter-spacing:.01em;margin:0;line-height:1.1}
h1 em{font-style:normal;color:#ffe9aa}.chip3d{display:inline-block;vertical-align:middle;margin-left:8px;transform:translateY(-2px);border:1px solid #9ce9eb73;background:#20aeb12b;color:#99f6ee;border-radius:8px;padding:4px 6px;font-size:12px;letter-spacing:.04em}
.best{text-align:center;min-width:104px;border:1px solid #6a79a1;border-radius:15px;padding:7px 12px;background:#222b4ed6;box-shadow:0 7px 15px #05091838}
.best small{display:block;font-size:10px;letter-spacing:.12em;color:#acc0e1;font-weight:800}
.best strong{font-size:22px;font-weight:1000;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:11px}
.stat{background:#2833529e;border:1px solid #536181;border-radius:13px;text-align:center;padding:8px 4px 7px}
.stat small{display:block;color:#becae2;font-size:10px;font-weight:800;margin-bottom:1px}
.stat strong{display:block;font-size:23px;line-height:1.12;font-variant-numeric:tabular-nums;font-weight:1000}
.stat:nth-child(3) strong{color:#ffe49e}.stat:nth-child(4) strong{color:#9fe9e7}.stat.bonus-flash{animation:timeFlash .65s ease-out}@keyframes timeFlash{30%{background:#2c816b;border-color:#b0ffca;box-shadow:0 0 22px #69ffae66}100%{background:#2833529e}}
.stage{position:relative;overflow:hidden;border-radius:22px;isolation:isolate;border:2px solid #8897ce;box-shadow:0 18px 45px #04081d82,inset 0 0 28px #9ec6ff2a;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse 65% 30% at 52% 30%,#7086cd56,transparent 75%),linear-gradient(165deg,#334985 0%,#3e448a 43%,#7775ad 78%,#b7aac5 100%)}
.stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--stars,.42);background-image:radial-gradient(circle at 11% 15%,#fff 0 1px,transparent 2px),radial-gradient(circle at 78% 13%,#fff 0 1.4px,transparent 2.2px),radial-gradient(circle at 45% 24%,#fff 0 1px,transparent 2px),radial-gradient(circle at 88% 37%,#fff 0 1px,transparent 2px),radial-gradient(circle at 20% 42%,#fff 0 1px,transparent 2px),radial-gradient(circle at 68% 57%,#fff 0 1px,transparent 2px);background-size:233px 263px}
canvas{display:block;width:100%;aspect-ratio:360 / 500;position:relative;z-index:1;touch-action:manipulation;cursor:pointer;outline:none}
.stage-top{position:absolute;z-index:2;top:13px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.pill{background:#17264cb5;border:1px solid #c7e7ff72;color:#e8f5ff;padding:6px 10px;border-radius:99px;letter-spacing:.04em;font-weight:900;font-size:10px;box-shadow:0 3px 12px #13214b36}
.bar{position:absolute;z-index:3;top:0;left:0;right:0;height:4px;background:#fff3}.bar>div{height:100%;background:linear-gradient(90deg,#66e8dc,#d4fdab,#ffcd88);width:100%}
.bottom-hint{position:absolute;z-index:2;bottom:16px;left:0;right:0;text-align:center;color:#eef9ff;pointer-events:none;text-shadow:0 2px 8px #19254e;font-size:13px;letter-spacing:.15em;font-weight:900}
.effect{position:absolute;z-index:3;top:31%;left:0;right:0;text-align:center;font-size:28px;line-height:1.2;font-weight:1000;color:#fff0a6;text-shadow:0 3px 0 #9f6c63,0 8px 22px #23274f;letter-spacing:.04em;pointer-events:none;opacity:0;transform:translateY(15px) scale(.9)}
.effect small{display:block;margin-top:7px;font-size:15px;color:#b7ffe1;text-shadow:0 2px 8px #123453;letter-spacing:.02em}.effect.show{animation:floatUp .86s ease-out both}@keyframes floatUp{0%{opacity:0;transform:translateY(16px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.08)}75%{opacity:1;transform:translateY(-10px) scale(1)}100%{opacity:0;transform:translateY(-35px) scale(1)}}
.overlay{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:linear-gradient(180deg,#18234283,#171b42af)}.overlay[hidden]{display:none}
.panel{text-align:center;width:100%;max-width:330px;border-radius:24px;border:1px solid #ceeaff77;background:linear-gradient(160deg,#24345cec,#1c2747ee);padding:24px 19px;box-shadow:0 22px 45px #0a1238a0}
.badge{display:inline-block;background:#fff0aa;color:#685126;padding:5px 12px;border-radius:99px;font-size:11px;letter-spacing:.1em;font-weight:1000;margin-bottom:10px}
.panel h2{margin:1px 0 10px;font-size:27px;line-height:1.27;font-weight:1000}
.panel p{font-size:13px;line-height:1.9;color:#dce6fa;margin:0 0 18px}.panel b{color:#ffe6a4}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
.primary{color:#312b3e;background:linear-gradient(130deg,#ffe5a4,#ffb69c);font-size:17px;letter-spacing:.02em;font-weight:1000;border-radius:14px;width:100%;padding:15px 10px;box-shadow:0 5px 0 #ac6977}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #ac6977}
.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:13px 0 20px}.result>div{padding:9px 4px;border-radius:12px;background:#101f3f;border:1px solid #536c97}.result small{display:block;font-size:10px;color:#b6c7e4}.result strong{display:block;font-size:21px;white-space:nowrap}
#endText{white-space:pre-line;line-height:1.75}
.sub{margin-top:12px;width:100%;padding:11px 8px;border-radius:12px;border:1px solid #8fa6d8;background:#2b3d68;color:#eaf3ff;font-size:14px;font-weight:900}.sub:active{background:#41567c}
.panel{max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-right:22px!important}.panel::-webkit-scrollbar{display:none}.subrow{display:flex;gap:7px}.subrow .sub{flex:1;min-width:0}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 4px}.bitem{background:#101f3f;border:1px solid #536c97;border-radius:10px;padding:7px 3px;font-size:10px;line-height:1.3;color:#dce6fa}.bitem i{display:block;font-style:normal;font-size:24px;line-height:1.2}.bitem.locked{opacity:.45}.bitem.locked i{filter:grayscale(1)}.bitem.new{border-color:#ffe08a;box-shadow:0 0 12px #ffe08a99}
.primary small{display:block;font-size:11px;font-weight:800;opacity:.75;margin-top:2px;letter-spacing:0}
/* ===== ブロック風UI（ロゴと同じ：前の面＋上の面（明るい）＋右の面（暗い）、細い白線、角は四角） ===== */
.panel{border-radius:3px;border:1.5px solid #ffffff4d;background:#1c2747f5;padding:20px 16px 18px;
 box-shadow:1px -1px 0 #34477c,2px -2px 0 #34477c,3px -3px 0 #34477c,4px -4px 0 #2c3d6c,5px -5px 0 #2c3d6c,6px -6px 0 #2c3d6c,7px -7px 0 #253460,0 18px 40px #05091890;margin:8px 8px 0 0}
.panel h2{font-size:22px;margin:6px 0 8px}
.btitle{display:block;height:30px;width:auto;max-width:100%;margin:2px auto 6px;overflow:visible}
.psub{font-size:12px!important;color:#b9c7e6!important;margin:0 0 14px!important;letter-spacing:.04em}
.primary,.sub,.sitem,.controls button{position:relative;border-radius:0;border:1.5px solid #ffffff8c;--d:6px;--top:#fff;--side:#999;margin-right:var(--d);transition:transform .07s}
.primary::before,.sub::before,.sitem::before,.controls button::before{content:"";position:absolute;left:-1.5px;right:-1.5px;bottom:calc(100% + 1.5px);height:var(--d);background:var(--top);transform:skewX(-45deg);transform-origin:0 100%;border:1px solid #ffffff59;border-bottom:0;pointer-events:none}
.primary::after,.sub::after,.sitem::after,.controls button::after{content:"";position:absolute;top:-1.5px;bottom:-1.5px;left:calc(100% + 1.5px);width:var(--d);background:var(--side);transform:skewY(-45deg);transform-origin:0 0;border:1px solid #ffffff40;border-left:0;pointer-events:none}
.primary:active,.sub:active,.sitem:active:not(:disabled),.controls button:active{transform:translate(4px,-4px);--d:2px}
.primary{--face:#ffb2a8;background:var(--face);--top:#ffd9d3;--side:#c98179;color:#2a1f33;box-shadow:none;margin-top:calc(var(--d) + 8px);border-radius:0}
.primary:active{box-shadow:none}
.primary.alt{--face:#7cddf1;background:var(--face);--top:#c4f2fb;--side:#4a9fb3;box-shadow:none}
.primary.alt:active{box-shadow:none}
#startBtn{--face:#ffb2a8}
#nextBtn{--face:#84e3c9;background:var(--face);--top:#c9f5e9;--side:#4f9e88}
.sub{background:#2b3d68;--top:#41598f;--side:#18223f;margin-top:calc(var(--d) + 8px);color:#eef4ff}
#timebar2{position:absolute;top:0;left:0;width:0;background:linear-gradient(90deg,#ffe066,#ffb347)!important}/* R18：60秒を超えた分 */
.controls button{background:#263455;--d:5px;--top:#3a4e80;--side:#141c36;margin-top:6px;min-height:44px}/* R13 */
.result>div{border-radius:0;border:1.5px solid #ffffff40;background:#101b38;box-shadow:1px -1px 0 #2a3a66,2px -2px 0 #2a3a66,3px -3px 0 #22305a}
.bitem{border-radius:0!important}
.stars-big{font-size:28px;line-height:1.1;color:#ffd34d;text-shadow:2px -2px 0 #b8892a;letter-spacing:6px;margin:0 0 4px}
#endPanel h2{font-size:20px;margin:2px 0 6px}#endPanel .result{margin:8px 0 6px}#endText{font-size:12.5px;margin-bottom:4px}
/* ブロック文字のラベル */
.bt{display:block;height:15px;width:auto;max-width:100%;margin:0 auto;overflow:visible;pointer-events:none}
.primary .bt{height:21px}.sub .bt{height:14px}.controls .bt{height:11px}.bt.flat{height:8px}
.stat small .bt.flat,.result small .bt.flat,.best small .bt.flat{height:7px;margin:2px auto 4px}
.effect .bt{width:88%;height:auto;max-height:30px;filter:drop-shadow(0 3px 0 #1c2747) drop-shadow(0 6px 14px #10183a)}.bottom-hint .bt{height:11px;opacity:.9}
.primary small{margin-top:5px}
/* ルール説明 */
#rulesPanel:not([hidden]){display:flex;flex-direction:column;overflow:hidden}
.rules{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;text-align:left;padding-right:2px}.rules::-webkit-scrollbar{display:none}
.rules h3{font-size:13px;font-weight:1000;color:#ffe6a4;margin:14px 0 4px;letter-spacing:.04em}.rules h3:first-child{margin-top:4px}
.rules p{font-size:12px!important;line-height:1.75!important;margin:0 0 4px!important;color:#dce6fa}
.krow{display:flex;align-items:center;gap:9px;font-size:12px;line-height:1.5;color:#dce6fa;margin:6px 0}.krow svg{width:24px;height:24px;flex:none}.krow b{color:#fff}
/* ステージ選択：ステージを「タワー」として下から積み上げる */
#stagePanel:not([hidden]){display:flex;flex-direction:column;overflow:hidden}#stagePanel .stower{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}#stagePanel .stower::-webkit-scrollbar{display:none}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex:none}.phead .btitle{margin:0;height:26px}.sub.mini{width:auto;flex:none;margin:6px 0 0;padding:4px 12px;font-size:16px;--d:4px}
.stower{display:flex;flex-direction:column-reverse;gap:11px;margin:6px 0 2px;padding:6px 8px 0 0}
.sitem{display:flex;align-items:center;gap:10px;width:90%;text-align:left;padding:5px 10px;background:var(--face);color:#22203a;font-size:14px;font-weight:1000;--d:7px;animation:slabDrop .5s cubic-bezier(.3,1.4,.55,1) backwards}
.sitem small{display:block;font-size:10px;font-weight:800;opacity:.75}
.sitem .num{height:20px;width:auto;flex:none;overflow:visible}
.sitem .stars{margin-left:auto;font-size:13px;color:#7a5200;letter-spacing:1px;white-space:nowrap}
.sitem:disabled{--face:#3a4466!important;--top:#4c5880!important;--side:#252c47!important;color:#aab4d4;cursor:default}
.sitem.ghost{--face:transparent!important;--top:transparent!important;--side:transparent!important;border-style:dashed;color:#9fb0d8;animation:none;opacity:.8}
@keyframes slabDrop{0%{transform:translateY(-90px);opacity:0}50%{opacity:1}100%{transform:none}}
/* ===== タイトルロゴ（ブロック文字） ===== */
#startPanel{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-width:380px;padding:0 10px 6px 0!important}
#startPanel .primary{padding:11px 10px}#startPanel .tagline{margin-bottom:8px}
.stage.title .stage-top,.stage.title .bottom-hint,.stage.title .bar{opacity:0;transition:opacity .3s}
#startPanel .tagline{font-size:13px;font-weight:800;letter-spacing:.12em;color:#e4ecff;margin:0 0 16px;text-shadow:0 2px 10px #0b1030}
.logo{display:block;width:100%;height:auto;overflow:visible;margin:0 auto 4px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.logo .lt{transform-box:fill-box;transform-origin:50% 100%;transition:transform .18s ease-out}
.logo .lt.drop{animation:ltDrop .75s cubic-bezier(.25,1.5,.5,1) backwards}
@keyframes ltDrop{0%{transform:translateY(-170px);opacity:0}40%{opacity:1}100%{transform:none;opacity:1}}
.logo .lt.pop{animation:ltPop .5s cubic-bezier(.2,.8,.3,1)}
@keyframes ltPop{0%{transform:translateY(-6px) scale(1.04,.96)}14%{transform:translateY(-20px) scale(1.07,.93)}45%{transform:translateY(2px) scale(.94,1.07)}70%{transform:translateY(-4px) scale(1.02,.98)}100%{transform:none}}
@media(hover:hover){.logo .lt:hover{transform:translateY(-4px)}}
.logo .sp{transform-box:fill-box;transform-origin:center;animation:spark .75s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes spark{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.2);opacity:0}}
.logo .star{animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.logo .cloud{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(12px)}}
@media(prefers-reduced-motion:reduce){.logo .lt.drop,.logo .star,.logo .cloud{animation:none}}
#introText{white-space:pre-line;font-size:13px;line-height:1.7;margin-bottom:8px}.stars-big{font-size:30px;color:#ffd34d;letter-spacing:4px;margin:-4px 0 6px}
.stat.hurry{background:#7a2c4a;border-color:#ff9db0}.stat.hurry strong{color:#ffd0d8;animation:hurry .45s ease-in-out infinite alternate}@keyframes hurry{to{transform:scale(1.18)}}
.controls{display:flex;gap:7px;margin-top:11px}.controls button{flex:1;border:1px solid #536789;border-radius:12px;padding:11px 5px;background:#263455;color:#eaf3ff;font-size:12px;font-weight:850;min-width:0}.controls button:active{background:#41567c}
.tip{text-align:center;margin:11px 2px 0;font-size:12px;line-height:1.6;color:#d5dff0}.fine{text-align:center;margin:6px 2px 0;font-size:10px;color:#a2b3d2}
button:focus-visible,canvas:focus-visible{outline:3px solid #a7f5ff;outline-offset:2px}
@media(max-height:720px){#startPanel .tagline{margin-bottom:4px}.logo{margin-bottom:0}#startPanel .primary{padding:9px 10px}}/* レビュー4回目 P2-05：低い画面でスタート画面がはみ出さないように */
@media(max-height:750px){.wrap{padding-top:8px}header{margin-bottom:8px}.stats{margin-bottom:7px}.stat{padding-top:5px;padding-bottom:5px}.stat strong{font-size:20px}.controls{margin-top:8px}.tip{margin-top:7px}}
</style>
</head>
<body>
<main class="wrap">
  <header><div><div class="eyebrow">MINI GAME 01 · <span id="ver"></span></div><h1>Tip Top <em>Tower</em></h1></div><div class="best"><small id="lblBest">BEST SCORE</small><strong id="best">0</strong></div></header>
  <div class="stats" aria-label="プレイ状況"><div class="stat"><small id="lblHeight">高さ</small><strong id="height">0</strong></div><div class="stat"><small id="lblScore">スコア</small><strong id="score">0</strong></div><div class="stat"><small id="lblCombo">コンボ</small><strong id="combo">0</strong></div><div class="stat"><small id="timeLabel">残り秒</small><strong id="time">60</strong></div></div>
  <section class="stage" id="stage" aria-label="3Dブロック積みゲーム">
    <canvas id="game" width="720" height="1000" aria-label="画面タップで移動中の3Dブロックを落とす" tabindex="0"></canvas>
    <div class="bar"><div id="timebar"></div><div id="timebar2"></div></div>
    <div class="stage-top"><span class="pill" id="goal">1段＝10m</span><span class="pill" id="level">LEVEL 1</span></div>
    <div class="effect" id="effect" aria-live="polite"><span id="effect-title"></span><small id="effect-detail"></small></div>
    <div class="bottom-hint" id="bottomHint">TAP TO STACK</div>
    <div class="overlay" id="overlay">
      <div class="panel" id="startPanel"><svg class="logo" id="logo" role="img" aria-label="Tip Top Tower"></svg><p class="tagline">ブロックを積んで、空のてっぺんへ。</p><button class="primary" id="startBtn" aria-label="エンドレス"></button><button class="primary alt" id="stageBtn" aria-label="ステージ"></button><div class="subrow"><button class="sub" id="badgeBtnStart" aria-label="バッジ"></button><button class="sub" id="rulesBtn" aria-label="ルール"></button></div></div>
      <div class="panel" id="stagePanel" hidden><div class="phead"><button class="sub mini" id="stageBack" aria-label="もどる">←</button><svg class="btitle" id="stageTitle" role="img" aria-label="STAGE"></svg></div><p class="psub">下から順にクリアしよう</p><div class="stower" id="stageList"></div></div>
      <div class="panel" id="introPanel" hidden><svg class="btitle" id="introBadge" role="img"></svg><h2 id="introTitle"></h2><p id="introText"></p><p class="psub" id="introStars"></p><button class="primary" id="introStart" aria-label="スタート"></button><button class="sub" id="introBack" aria-label="もどる"></button></div>
      <div class="panel" id="endPanel" hidden><svg class="btitle" id="endBadge" role="img"></svg><h2 id="endTitle">ゲーム終了</h2><div class="stars-big" id="endStars" hidden></div><p id="endText">もう一度挑戦してみよう</p><div class="result"><div><small id="lblFScore">SCORE</small><strong id="finalScore">0</strong></div><div><small id="lblFHeight">高さ</small><strong id="finalHeight">0</strong></div><div><small id="lblFPeople">住人</small><strong id="finalResidents">0</strong></div></div><button class="primary" id="nextBtn" hidden aria-label="次のステージ"></button><button class="primary" id="againBtn" aria-label="もう一度"></button><div class="subrow"><button class="sub" id="viewBtn" aria-label="タワーを見る"></button><button class="sub" id="badgeBtnEnd" aria-label="バッジ"></button></div><button class="sub" id="menuBtn" aria-label="メニューへ"></button></div>
      <div class="panel" id="rulesPanel" hidden><div class="phead"><button class="sub mini" id="rulesBack" aria-label="もどる">←</button><svg class="btitle" id="rulesTitle" role="img" aria-label="RULES"></svg></div><div class="rules" id="rulesBody"></div></div>
      <div class="panel" id="badgePanel" hidden><svg class="btitle" id="badgeTitle" role="img" aria-label="BADGES"></svg><p class="psub" id="badgeCount"></p><div class="bgrid" id="badgeGrid"></div><button class="sub" id="badgeBack" aria-label="もどる"></button></div>
    </div>
  </section>
  <div class="controls"><button id="restart" aria-label="はじめから"></button><button id="rotate" aria-label="視点変更"></button><button id="sound" aria-label="音のオンオフ" aria-pressed="true"></button></div>
  <p class="tip" id="tip">PERFECTで時間回復。連続PERFECTで音がドレミと上がるよ！</p>
  <p class="fine">3D立体表示・オフライン対応・最高記録は端末内に保存</p>
</main>
<script>
(()=>{'use strict';
const VERSION='v0.20.0';
/* ===== 外部コードレビュー（v0.14.0 が対象、2026-10-20）への回答 =====
